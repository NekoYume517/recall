name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # The CDN only publishes `latest`; dated versions 403, so a literal version
  # pin cannot be downloaded. What *can* be pinned is the level this source
  # targets: `moon 0.1.20261126` / `moonc v1.0.0-rc1` (2026-11-30, toolchain 1.0
  # audit). The installer below takes `latest`, then hard-fails if that turns out
  # to be *older* than the level the code is written against. That converts silent
  # drift into a clear error.
  MOONBIT_MIN_VERSION: "0.1.20261124"
  # The compiler reports its own version separately from the build system, and a
  # 1.0 compiler is what the audit of 2026-11-30 measured all five repos on.
  MOONC_MIN_VERSION: "v1.0.0-rc1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify toolchain is at least ${{ env.MOONBIT_MIN_VERSION }}
        run: |
          moon version --all
          got=$(moon version | head -n1 | awk '{print $2}')
          echo "moon: installed $got  minimum $MOONBIT_MIN_VERSION"
          newest=$(printf '%s\n%s\n' "$MOONBIT_MIN_VERSION" "$got" | sort -V | tail -n1)
          if [ "$newest" != "$got" ]; then
            echo "::error::build system $got is older than the level this repo targets ($MOONBIT_MIN_VERSION)"
            exit 1
          fi
          # `moonc` is the compiler; the dated `moon` number does not imply which
          # one it is. Both 0.x and 1.x rc spellings start with `v`, so a plain
          # string sort puts anything pre-1.0 below `v1.0.0-rc1` -- which is the
          # answer we want (a 0.x compiler is below the level this source targets).
          gotc=$(moonc -v | awk '{print $1}')
          echo "moonc: installed $gotc  minimum $MOONC_MIN_VERSION"
          newestc=$(printf '%s\n%s\n' "$MOONC_MIN_VERSION" "$gotc" | sort -V | tail -n1)
          if [ "$newestc" != "$gotc" ]; then
            echo "::error::compiler $gotc is older than the level this repo targets ($MOONC_MIN_VERSION)"
            exit 1
          fi

      # Fresh runners start with an empty registry index. Without this,
      # dependency resolution fails with 'module was not found in the
      # registry' (the toolchain's own warning points here).
      - name: Update registry index
        run: moon update

      # Errors must be zero. Warnings are allowed: the codebase still carries
      # style-level notices that are not defects.
      - name: Type check
        run: moon check

      - name: Format check
        run: moon fmt --check

      - name: Run tests
        run: moon test --release

      - name: Build wasm
        run: moon build --target wasm

      # The js backend is a second, genuinely different layout of the same code
      # (one number type, no f32, no linear memory). Two of the five repos can
      # only be fully exercised there, and the 2026-11-30 toolchain-1.0 audit
      # found one backend-dependent result that was invisible on wasm — so the
      # backend is exercised on every push from now on.
      - name: Run tests (js backend)
        run: moon test --release --target js

      - name: Build js
        run: moon build --target js